notify:
  name: Send Instrument Cluster Notification
  description: Send a text popup notification to the vehicle instrument cluster OSD (track popup or call popup).
  fields:
    message:
      name: Message
      description: The notification message text to display on the cluster.
      example: "Driveway Gate Opening"
      required: true
      selector:
        text:
    title:
      name: Title
      description: Optional title or prefix for the notification.
      example: "Alert"
      required: false
      selector:
        text:
    caller:
      name: Caller Name (Call Popup)
      description: Header/Caller name for Call Notification Popup (e.g. "Home Assistant", "Front Door", "Alice"). If provided, triggers the call popup instead of the track popup.
      example: "Front Gate"
      required: false
      selector:
        text:
    type:
      name: Popup Type
      description: Type of notification popup to trigger.
      example: "call"
      default: "track"
      selector:
        select:
          options:
            - label: Track / Media Popup (OSD top banner)
              value: track
            - label: Call Popup (Incoming call style popup)
              value: call
    level:
      name: Severity Level
      description: Popup severity level (controls cluster icon / color).
      example: "info"
      default: "info"
      selector:
        select:
          options:
            - label: Info (White/Blue)
              value: info
            - label: Warning (Amber/Yellow)
              value: warning
            - label: Error (Red)
              value: error
    hold_ms:
      name: Hold Duration (ms)
      description: Duration to hold the notification popup on the cluster screen in milliseconds.
      example: 5000
      default: 5000
      selector:
        number:
          min: 1000
          max: 30000
          step: 500
          unit_of_measurement: ms

set_hud_nav:
  name: Project Turn-by-Turn Navigation on HUD
  description: Project turn-by-turn navigation maneuver graphics, distance countdown, and street names onto the vehicle Head-Up Display (HUD) and Cluster.
  fields:
    icon:
      name: Maneuver Icon
      description: Maneuver icon code (1=Straight, 2=Slight Right, 3=Right 90°, 4=Sharp Right, 5=U-Turn Left, 6=U-Turn Right, 7=Slight Left, 8=Left 90°, 9=Sharp Left, 10=Roundabout Exit 1, 31=Destination).
      example: 3
      default: 1
      required: true
      selector:
        number:
          min: 0
          max: 31
          mode: box
    distance:
      name: Distance to Turn (meters)
      description: Distance remaining to maneuver in meters.
      example: 250
      default: 0
      required: false
      selector:
        number:
          min: 0
          max: 65535
          unit_of_measurement: m
    bars:
      name: Proximity Countdown Bars
      description: Number of countdown blocks shown as turn approaches (0 to 8).
      example: 4
      default: 0
      required: false
      selector:
        number:
          min: 0
          max: 8
    street:
      name: Street Name
      description: Street or road name displayed on the cluster navigation screen (e.g. "Main St").
      example: "Main St"
      required: false
      selector:
        text:
    speed_limit:
      name: Speed Limit (km/h)
      description: Speed limit sign display in km/h (0 = off).
      example: 65
      default: 0
      required: false
      selector:
        number:
          min: 0
          max: 200
    camera_alert:
      name: Speed Camera Alert
      description: Show speed camera warning icon on HUD.
      default: false
      required: false
      selector:
        boolean:

clear_hud_nav:
  name: Clear HUD Navigation
  description: Gracefully dismiss and clear active turn-by-turn guidance graphics from the Head-Up Display.
