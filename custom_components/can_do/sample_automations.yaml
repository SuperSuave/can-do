# Home Assistant Automations demonstrating CAN Do MQTT command dispatch
# Add to your automations.yaml or import via UI

# 1. Android Auto connected -> Set driver comfort profile
- id: can_do_android_auto_driver_profile
  alias: "CAN Do: Apply Driver Profile on Android Auto Connect"
  description: "When phone connects to Android Auto, set driver seat comfort to Medium Cool"
  trigger:
    - platform: state
      entity_id: sensor.andrews_phone_bluetooth_connection
      to: "Android Auto"
  condition:
    - condition: state
      entity_id: select.cando_kia_ev6_drivers_seat_comfort
      state: "Off"
  action:
    - service: select.select_option
      target:
        entity_id: select.cando_kia_ev6_drivers_seat_comfort
      data:
        option: "Medium Cool"
  mode: single

# 2. Morning departure schedule -> Trigger climate and warmers
- id: can_do_morning_precondition
  alias: "CAN Do: Morning Precondition on Weekdays"
  description: "Trigger climate, seat heat, and wheel heat at 7:30 AM if cold"
  trigger:
    - platform: time
      at: "07:30:00"
  condition:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: numeric_state
      entity_id: sensor.outdoor_temperature
      below: 45
  action:
    - service: can_do.start_remote_climate
      data:
        temperature: 22.0
        defrost: true
        duration_minutes: 15
  mode: single

# 3. Key Fob detected on vehicle unlock -> Automatically recall driver memory seat
- id: can_do_key_fob_ims_memory_recall
  alias: "CAN Do: Recall Driver Profile on Key Fob Detection"
  description: "When Key Fob 1 or 2 is detected by the Smart Key Unit on unlock, motorize seats & mirrors to that driver's stored position"
  trigger:
    - platform: state
      entity_id: sensor.active_smart_key_fob_driver_id
      to: "Driver 1 (Key Fob 1)"
      id: "driver_1"
    - platform: state
      entity_id: sensor.active_smart_key_fob_driver_id
      to: "Driver 2 (Key Fob 2)"
      id: "driver_2"
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: "driver_1"
          sequence:
            - service: select.select_option
              target:
                entity_id: select.driver_memory_seat_mirror_profile_ims
              data:
                option: "Recall Driver 1 Profile"
        - conditions:
            - condition: trigger
              id: "driver_2"
          sequence:
            - service: select.select_option
              target:
                entity_id: select.driver_memory_seat_mirror_profile_ims
              data:
                option: "Recall Driver 2 Profile"
  mode: restart

# 4. Auto-Close All Windows on Vehicle Lock / Rain
- id: can_do_auto_close_windows_on_lock
  alias: "CAN Do: Auto-Close All Windows on Vehicle Lock"
  description: "When the vehicle is locked, automatically roll up any open windows to secure the cabin"
  trigger:
    - platform: state
      entity_id: lock.door_locks
      to: "locked"
  condition:
    - condition: state
      entity_id: binary_sensor.cabin_windows_state
      state: "on"
  action:
    - service: cover.close_cover
      target:
        entity_id: cover.all_power_windows_global
  mode: single

# 5. Bluetooth Remote Multi-Button Combo Chord -> Trigger Action / Garage Door
- id: can_do_ble_remote_button_chord
  alias: "CAN Do: BLE Remote Combo Chord (Mute + Vol Down)"
  description: "When the Bluetooth remote dual-button chord 'mute+volume_down' is pressed, trigger garage door or driveway gate"
  trigger:
    - platform: event
      event_type: cando_ble_button_event
      event_data:
        combo: "mute+volume_down"
  action:
    - service: notify.notify
      data:
        message: "BLE Button Chord Detected: Mute + Vol Down"
  mode: single

# 6. BLE Beacon / Phone Proximity Arrival -> Welcome Lighting & Unlock
- id: can_do_ble_beacon_approach_welcome
  alias: "CAN Do: BLE Beacon Proximity Approach"
  description: "When the driver approaches vehicle within RSSI threshold (-75 dBm), turn on puddle lamps and welcome lights"
  trigger:
    - platform: state
      entity_id: binary_sensor.ble_beacon_presence
      to: "on"
  condition:
    - condition: numeric_state
      entity_id: sensor.ble_beacon_rssi
      above: -75
  action:
    - service: light.turn_on
      target:
        entity_id: light.exterior_welcome_puddle_lamps
  mode: single

