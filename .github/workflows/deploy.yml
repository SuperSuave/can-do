name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "frontend/**"
      - "catalog/**"
      - ".github/workflows/deploy.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Verify checkout and lockfile
        working-directory: frontend
        run: |
          echo "Working directory: $PWD"
          git rev-parse HEAD
          test -f package.json
          test -f package-lock.json
          git ls-files --error-unmatch package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.lockfileVersion < 1) process.exit(1)"
          npm --version

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build
        working-directory: frontend
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || node -e "try { console.log(JSON.parse(require('fs').readFileSync('../catalog/can_do_catalog.json')).catalog_version); } catch(e){ console.log('2026.9.4'); }")
          echo "Building frontend with VITE_APP_VERSION=$LATEST_TAG"
          VITE_APP_VERSION="$LATEST_TAG" npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
