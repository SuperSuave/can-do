name: Build ESP32 Firmware

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
    paths:
      - "firmware/**"
      - "frontend/**"
      - "catalog/**"
      - ".github/workflows/firmware.yml"

  pull_request:
    branches: ["main", "master"]
    paths:
      - "firmware/**"
      - "frontend/**"
      - "catalog/**"
      - ".github/workflows/firmware.yml"

  workflow_dispatch:
    inputs:
      target:
        description: "Target ESP32 chip"
        required: true
        default: "esp32c3"
        type: choice
        options:
          - "esp32c3"
          - "esp32s3"
          - "esp32"
      idf_version:
        description: "ESP-IDF version tag"
        required: true
        default: "v5.3"
        type: choice
        options:
          - "v5.3"
          - "v5.2"
          - "v5.1"
      create_release:
        description: "Create or update GitHub Release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v2026.9.1, leave empty for tag push)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: "firmware-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Firmware (${{ inputs.target || 'esp32c3' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Ensure ccache directory exists
        run: mkdir -p ~/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: esp-idf-ccache-${{ runner.os }}-${{ inputs.target || 'esp32c3' }}-${{ github.sha }}
          restore-keys: |
            esp-idf-ccache-${{ runner.os }}-${{ inputs.target || 'esp32c3' }}-
            esp-idf-ccache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Build Embedded React Frontend for LittleFS
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ inputs.idf_version || 'v5.3' }}
          target: ${{ inputs.target || 'esp32c3' }}
          path: "firmware"
          extra_docker_args: "-e IDF_CCACHE_ENABLE=1 -v ~/.ccache:/root/.ccache"
          command: |
            sh -c "idf.py build && cd build && esptool.py --chip ${{ inputs.target || 'esp32c3' }} merge_bin -o can-do-${{ inputs.target || 'esp32c3' }}-merged.bin @flash_args"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: can-do-firmware-${{ inputs.target || 'esp32c3' }}
          path: |
            firmware/build/can-do.bin
            firmware/build/can-do-*-merged.bin
            firmware/build/storage.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
          if-no-files-found: error

      - name: Prepare Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        run: |
          mkdir -p release_assets
          cp firmware/build/can-do.bin release_assets/can-do-${{ inputs.target || 'esp32c3' }}.bin
          cp firmware/build/can-do.bin release_assets/can-do.bin
          cp firmware/build/can-do-*-merged.bin release_assets/ 2>/dev/null || true
          cp firmware/build/storage.bin release_assets/storage.bin
          cp catalog/can_do_catalog.json release_assets/can_do_catalog.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v2026.9.1' }}
          name: CAN-Do Release ${{ inputs.release_tag != '' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v2026.9.1' }}
          generate_release_notes: true
          files: |
            release_assets/*

