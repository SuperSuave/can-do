name: Build ESP32 Firmware

on:
  push:
    tags: ["*"]

  workflow_dispatch:
    inputs:
      target:
        description: "Target ESP32 chip"
        required: true
        default: "esp32c3"
        type: choice
        options:
          - "esp32c3"
          - "esp32s3"
          - "esp32"
      idf_version:
        description: "ESP-IDF version tag"
        required: true
        default: "v5.3"
        type: choice
        options:
          - "v5.3"
          - "v5.2"
          - "v5.1"
      create_release:
        description: "Create or update GitHub Release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. 2026.9.1, leave empty for tag push)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: "firmware-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Firmware (${{ inputs.target || 'esp32c3' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Ensure ccache directory exists
        run: mkdir -p ~/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: esp-idf-ccache-${{ runner.os }}-${{ inputs.target || 'esp32c3' }}-${{ github.sha }}
          restore-keys: |
            esp-idf-ccache-${{ runner.os }}-${{ inputs.target || 'esp32c3' }}-
            esp-idf-ccache-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Determine Dynamic Release Version
        run: |
          TAG="${{ inputs.release_tag != '' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(cat firmware/version.txt 2>/dev/null || echo "2026.9.6")
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "$TAG" > firmware/version.txt
          # Dynamically stamp can_do_version
          node -e "const fs = require('fs'); const p = 'catalog/can_do_catalog.json'; const c = JSON.parse(fs.readFileSync(p)); c.can_do_version = '$TAG'; delete c.catalog_version; fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');"
          # Dynamically stamp frontend package.json version
          node -e "const fs = require('fs'); const p = 'frontend/package.json'; const pkg = JSON.parse(fs.readFileSync(p)); pkg.version = '$TAG'; fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');"
          # Dynamically stamp Home Assistant integration
          node -e "const fs = require('fs'); const p = 'custom_components/can_do/manifest.json'; const m = JSON.parse(fs.readFileSync(p)); m.version = '$TAG'; fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');"
          python3 -c "import re; p='custom_components/can_do/const.py'; s=open(p).read(); open(p,'w').write(re.sub(r'VERSION\s*=\s*[\"\'\'][^\"\'\']+[\"\'\']', f'VERSION = \"$TAG\"', s))"

      - name: Build Embedded React Frontend for LittleFS
        run: |
          cd frontend
          npm ci || npm install
          VITE_APP_VERSION="${{ env.RELEASE_TAG }}" npm run build

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ inputs.idf_version || 'v5.3' }}
          target: ${{ inputs.target || 'esp32c3' }}
          path: "firmware"
          extra_docker_args: "-e IDF_CCACHE_ENABLE=1 -v ~/.ccache:/root/.ccache"
          command: |
            sh -c "idf.py -DPROJECT_VER=\"${{ env.RELEASE_TAG }}\" build && cd build && esptool.py --chip ${{ inputs.target || 'esp32c3' }} merge_bin -o can-do-${{ inputs.target || 'esp32c3' }}-merged.bin @flash_args"

      - name: Fix workspace permissions after Docker
        if: always()
        run: sudo chown -R $USER:$USER .

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: can-do-firmware-${{ inputs.target || 'esp32c3' }}
          path: |
            firmware/build/can-do.bin
            firmware/build/can-do-*-merged.bin
            firmware/build/storage.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
          if-no-files-found: error

      - name: Setup Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build M5Stack Atom Lite Bridge (PlatformIO)
        run: |
          pip install --upgrade platformio esptool
          cd atom-ui-bridge
          python3 sync_web_assets.py
          pio run
          pio run -t buildfs
          cd .pio/build/m5stack-atom
          esptool.py --chip esp32 merge_bin -o can-do-atom-bridge-merged.bin \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin \
            0x1F0000 littlefs.bin

      - name: Upload Atom Lite firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: can-do-atom-bridge
          path: |
            atom-ui-bridge/.pio/build/m5stack-atom/firmware.bin
            atom-ui-bridge/.pio/build/m5stack-atom/littlefs.bin
            atom-ui-bridge/.pio/build/m5stack-atom/can-do-atom-bridge-merged.bin
          if-no-files-found: warn

      - name: Prepare Release Assets
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        run: |
          mkdir -p release_assets
          TAG="${{ env.RELEASE_TAG }}"
          TARGET="${{ inputs.target || 'esp32c3' }}"

          # Clean versioned WiCAN release assets
          cp firmware/build/can-do.bin "release_assets/can-do-${TARGET}-${TAG}.bin"
          cp firmware/build/can-do.bin "release_assets/can-do-${TARGET}.bin"
          cp firmware/build/can-do.bin "release_assets/can-do.bin"
          cp firmware/build/can-do-*-merged.bin "release_assets/can-do-${TARGET}-${TAG}-merged.bin" 2>/dev/null || true
          cp catalog/can_do_catalog.json "release_assets/can_do_catalog-${TAG}.json"
          cp catalog/can_do_catalog.json "release_assets/can_do_catalog.json"
          cp firmware/data/www/frontend_manifest.json "release_assets/frontend_manifest.json" 2>/dev/null || true
          (cd firmware/data/www && zip -r "../../../release_assets/can-do-web-${TAG}.zip" .)

          # Atom Lite Bridge release assets
          if [ -d "atom-ui-bridge/.pio/build/m5stack-atom" ]; then
            cp atom-ui-bridge/.pio/build/m5stack-atom/firmware.bin "release_assets/can-do-atom-bridge-${TAG}.bin" 2>/dev/null || true
            cp atom-ui-bridge/.pio/build/m5stack-atom/firmware.bin "release_assets/can-do-atom-bridge.bin" 2>/dev/null || true
            cp atom-ui-bridge/.pio/build/m5stack-atom/littlefs.bin "release_assets/can-do-atom-littlefs-${TAG}.bin" 2>/dev/null || true
            cp atom-ui-bridge/.pio/build/m5stack-atom/littlefs.bin "release_assets/can-do-atom-littlefs.bin" 2>/dev/null || true
            cp atom-ui-bridge/.pio/build/m5stack-atom/can-do-atom-bridge-merged.bin "release_assets/can-do-atom-bridge-${TAG}-merged.bin" 2>/dev/null || true
            cp atom-ui-bridge/.pio/build/m5stack-atom/can-do-atom-bridge-merged.bin "release_assets/can-do-atom-bridge-merged.bin" 2>/dev/null || true
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release_assets/*

      - name: Sync Version Changes Back to Main Branch
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        continue-on-error: true
        run: |
          sudo chown -R $USER:$USER .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout -f main

          # Re-apply version stamp on main in case tag was detached
          node -e "const fs = require('fs'); const p = 'catalog/can_do_catalog.json'; const c = JSON.parse(fs.readFileSync(p)); c.can_do_version = '${{ env.RELEASE_TAG }}'; delete c.catalog_version; fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');"
          node -e "const fs = require('fs'); const p = 'frontend/package.json'; const pkg = JSON.parse(fs.readFileSync(p)); pkg.version = '${{ env.RELEASE_TAG }}'; fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');"
          node -e "const fs = require('fs'); const p = 'custom_components/can_do/manifest.json'; const m = JSON.parse(fs.readFileSync(p)); m.version = '${{ env.RELEASE_TAG }}'; fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');"
          python3 -c "import re; p='custom_components/can_do/const.py'; s=open(p).read(); open(p,'w').write(re.sub(r'VERSION\s*=\s*[\"\'\'][^\"\'\']+[\"\'\']', 'VERSION = \"${{ env.RELEASE_TAG }}\"', s))"
          echo "${{ env.RELEASE_TAG }}" > firmware/version.txt

          # Re-bundle frontend to ensure LittleFS data/www has stamped version
          cd frontend
          npm ci || npm install
          VITE_APP_VERSION="${{ env.RELEASE_TAG }}" npm run build
          cd ..

          # Copy binary to firmware directory for static raw GitHub CDN serving
          if [ -f firmware/build/can-do.bin ]; then
            cp firmware/build/can-do.bin "firmware/can-do-${{ inputs.target || 'esp32c3' }}.bin"
          fi

          git add -f catalog/can_do_catalog.json frontend/package.json custom_components/can_do/manifest.json custom_components/can_do/const.py firmware/version.txt firmware/data/www/ firmware/can-do-${{ inputs.target || 'esp32c3' }}.bin 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Main branch is already up to date with version ${{ env.RELEASE_TAG }}."
          else
            git commit -m "chore(release): sync version ${{ env.RELEASE_TAG }} and web assets to main [skip ci]"
            git push origin main || echo "Sync push skipped"
          fi

