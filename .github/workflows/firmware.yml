name: Build ESP32 Firmware

on:
  push:
    branches: ["main", "master"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

  pull_request:
    branches: ["main", "master"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

  workflow_dispatch:
    inputs:
      target:
        description: "Target ESP32 chip"
        required: true
        default: "esp32c3"
        type: choice
        options:
          - "esp32c3"
          - "esp32s3"
          - "esp32"
      idf_version:
        description: "ESP-IDF version tag"
        required: true
        default: "v5.3"
        type: choice
        options:
          - "v5.3"
          - "v5.2"
          - "v5.1"

permissions:
  contents: read

concurrency:
  group: "firmware-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Firmware (${{ inputs.target || 'esp32c3' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: esp-idf-ccache-${{ runner.os }}-${{ inputs.target || 'esp32c3' }}-${{ github.sha }}
          restore-keys: |
            esp-idf-ccache-${{ runner.os }}-${{ inputs.target || 'esp32c3' }}-
            esp-idf-ccache-${{ runner.os }}-

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ inputs.idf_version || 'v5.3' }}
          target: ${{ inputs.target || 'esp32c3' }}
          path: "firmware"
          extra_docker_args: "-e IDF_CCACHE_ENABLE=1 -v ~/.ccache:/root/.ccache"
          command: |
            sh -c "idf.py build && esptool.py --chip ${{ inputs.target || 'esp32c3' }} merge_bin -o build/can-do-${{ inputs.target || 'esp32c3' }}-merged.bin @build/flash_args"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: can-do-firmware-${{ inputs.target || 'esp32c3' }}
          path: |
            firmware/build/can-do.bin
            firmware/build/can-do-*-merged.bin
            firmware/build/storage.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
          if-no-files-found: error
