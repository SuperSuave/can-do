    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('can_do_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.backgroundColor = '#050606';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f4f5f6';
          }
        } catch (e) {}
      })();

      // Catch stale cached chunk load errors and provide automatic cache-busting recovery
      function triggerCacheBustReload() {
        try {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        } catch (e) {}
        var u = new URL(window.location.href);
        u.searchParams.set('_t', Date.now());
        window.location.replace(u.toString());
      }

      window.addEventListener('error', function(event) {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0 || root.querySelector('.initial-loader'))) {
            var now = Date.now();
            var lastAuto = parseInt(sessionStorage.getItem('cando_last_auto_reload') || '0', 10);
            if (now - lastAuto > 10000) {
              sessionStorage.setItem('cando_last_auto_reload', String(now));
              triggerCacheBustReload();
              return;
            }
            root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050606;color:#f87171;font-family:system-ui,sans-serif;padding:24px;text-align:center;"><div style="background:#17191a;border:1px solid #29292a;border-radius:16px;padding:28px 24px;max-width:440px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);"><h2 style="color:#fcfcfc;margin-top:0;font-size:18px;font-weight:700;">Update Available</h2><p style="color:#9ea0a2;font-size:13px;line-height:1.6;margin:12px 0 20px;">Your browser loaded a cached version of CAN Do. Refresh to load the latest release.</p><button onclick="triggerCacheBustReload();" style="padding:10px 24px;border-radius:8px;background:#0284c7;color:#fcfcfc;border:none;font-weight:600;font-size:13px;cursor:pointer;transition:background 0.2s;">Refresh Page</button></div></div>';
          }
        }
      }, true);
    </script>

  <body style="margin: 0; background-color: #050606;">
    <div id="root">
      <div class="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050606; color: #9ea0a2; font-family: system-ui, sans-serif;">
        <div style="width: 42px; height: 42px; border: 3px solid rgba(158, 160, 162, 0.2); border-top-color: #0089da; border-radius: 50%; animation: cando-spin 0.9s linear infinite;"></div>
