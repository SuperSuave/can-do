    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('can_do_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#111318';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8f9fa';
          }
        } catch (e) {}
      })();

      // Catch stale cached chunk load errors and provide automatic 1-click refresh
      window.addEventListener('error', function(event) {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0 || root.querySelector('.initial-loader'))) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111318;color:#f87171;font-family:system-ui,sans-serif;padding:24px;text-align:center;"><div style="background:#1b1f26;border:1px solid #334155;border-radius:16px;padding:28px 24px;max-width:440px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);"><h2 style="color:#fff;margin-top:0;font-size:18px;font-weight:700;">Update Available</h2><p style="color:#94a3b8;font-size:13px;line-height:1.6;margin:12px 0 20px;">Your browser loaded a cached version of CAN Do. Refresh to load the latest release.</p><button onclick="location.reload(true);" style="padding:10px 24px;border-radius:8px;background:#0284c7;color:#fff;border:none;font-weight:600;font-size:13px;cursor:pointer;transition:background 0.2s;">Refresh Page</button></div></div>';
          }
        }
      }, true);
    </script>
